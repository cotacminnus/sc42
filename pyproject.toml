[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tx42"
version = "0.1.0"
description = "A command-line implementation of Texas 42"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
openspiel = ["open_spiel>=1.6,<2", "numpy>=1.24"]

[project.scripts]
tx42 = "texas42.cli:main"

[tool.setuptools.packages.find]
include = ["texas42*"]
