name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            package: "."
            openspiel: false
          - python: "3.13"
            package: ".[openspiel]"
            openspiel: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '${{ matrix.package }}'
      - if: matrix.openspiel
        run: python -c "import pyspiel, numpy, texas42.openspiel"
      - run: python -m unittest discover -s tests -v
